name: Mirror to personal repo

on:
  push:
    branches:
      - stable
      - stage

jobs:
  mirror:
    if: github.repository == 'Bettwaren-Shop/makaira-image-manager'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load mirror SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_KEY }}

      - name: Push current branch to mirror repo
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          git remote remove mirror 2>/dev/null || true
          git remote add mirror git@github.com:katharinadobiosch/makaira-image-manager.git
          git push mirror "HEAD:${BRANCH}"
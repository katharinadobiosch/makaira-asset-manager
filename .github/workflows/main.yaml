name: Mirroring

on: [push, delete]

jobs:
  to_github:
    runs-on: ubuntu-latest
    if: github.repository == 'Bettwaren-Shop/makaira-asset-manager'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:Bettwaren-Shop/makaira-asset-manager.git
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB }}

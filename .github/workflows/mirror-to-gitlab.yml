name: Mirror to GitLab

on:
  push:
    branches:
      - stable

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push stable to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          GITLAB_REMOTE_URL: ${{ secrets.GITLAB_REMOTE_URL }}
        run: |
          git push --force https://oauth2:${GITLAB_TOKEN}@${GITLAB_REMOTE_URL#https://} stable:stable